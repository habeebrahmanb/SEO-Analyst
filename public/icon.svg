<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13144D"/>
      <stop offset="100%" stop-color="#0a0b2c"/>
    </linearGradient>
    <linearGradient id="trend-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#02E3A7"/>
      <stop offset="100%" stop-color="#6AF15C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#02E3A7" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Bar Chart Base -->
  <rect x="96" y="280" width="48" height="136" rx="12" fill="#02E3A7" fill-opacity="0.25"/>
  <rect x="184" y="220" width="48" height="196" rx="12" fill="#02E3A7" fill-opacity="0.45"/>
  <rect x="272" y="150" width="48" height="266" rx="12" fill="url(#trend-grad)"/>

  <!-- Trend Arrow Polyline -->
  <path d="M 96,260 L 190,190 L 285,120 L 400,75" fill="none" stroke="url(#trend-grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Arrowhead Pointer -->
  <path d="M 335,75 L 405,75 L 405,145" fill="none" stroke="url(#trend-grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pulse Dot -->
  <circle cx="405" cy="75" r="16" fill="#6AF15C"/>
</svg>
